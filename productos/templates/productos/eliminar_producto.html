{% extends "base.html" %}
{% block titulo %}Eliminar producto{% endblock %}
{% block contenido %}

<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 m-0"><i class="bi bi-trash"></i> Eliminar producto</h1>
  <a href="{% url 'productos:inicio' %}" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left"></i> Volver
  </a>
</div>

<div class="card shadow-sm">
  <div class="card-body">
    <p>¿Seguro que quieres eliminar <strong>{{ producto.nombre }}</strong>?</p>
    <p class="text-muted small">Esta acción no se puede deshacer.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">
        <i class="bi bi-trash"></i> Sí, eliminar
      </button>
      <a href="{% url 'productos:inicio' %}" class="btn btn-secondary">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
