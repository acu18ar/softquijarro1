{% extends "base.html" %}
{% block titulo %}Eliminar proveedor{% endblock %}
{% block contenido %}
<h1 class="h3 mb-3"><i class="bi bi-trash"></i> Eliminar proveedor</h1>
<p>¿Seguro que quieres eliminar a <strong>{{ proveedor.nombre }}</strong>? Esta acción no se puede deshacer.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Sí, eliminar</button>
  <a href="{% url 'proveedores:detalle' proveedor.pk %}" class="btn btn-outline-secondary">Cancelar</a>
</form>
{% endblock %}
